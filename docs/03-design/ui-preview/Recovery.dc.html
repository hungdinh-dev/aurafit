<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { view: 'front' };
  }
  renderVals() {
    const rec = {
      chest: [35, '22 giờ'], front_delts: [55, '14 giờ'], side_delts: [70, '8 giờ'], rear_delts: [82, ''],
      biceps: [86, ''], triceps: [48, '16 giờ'], forearms: [90, ''], abs: [76, '5 giờ'], obliques: [92, ''],
      traps: [84, ''], lats: [62, '12 giờ'], upper_back: [66, '10 giờ'], lower_back: [91, ''],
      glutes: [100, ''], quads: [100, ''], hamstrings: [96, ''], adductors: [null, ''], calves: [null, '']
    };
    const names = {
      chest: 'Ngực', front_delts: 'Vai trước', side_delts: 'Vai giữa', rear_delts: 'Vai sau', biceps: 'Tay trước',
      triceps: 'Tay sau', forearms: 'Cẳng tay', abs: 'Bụng', obliques: 'Bụng chéo', traps: 'Cơ thang', lats: 'Xô',
      upper_back: 'Lưng giữa', lower_back: 'Lưng dưới', glutes: 'Mông', quads: 'Đùi trước', hamstrings: 'Đùi sau',
      adductors: 'Đùi trong', calves: 'Bắp chân'
    };
    const colorOf = (p) => p === null || p >= 80 ? '#48484A' : p >= 65 ? '#8E4B48' : p >= 40 ? '#C9504A' : '#FF453A';
    const c = {};
    Object.keys(rec).forEach((k) => { c[k] = colorOf(rec[k][0]); });
    const tired = Object.keys(rec)
      .filter((k) => rec[k][0] !== null && rec[k][0] < 80)
      .sort((a, b) => rec[a][0] - rec[b][0])
      .slice(0, 5)
      .map((k, i) => ({
        name: names[k], pct: rec[k][0], eta: 'còn ' + rec[k][1], color: colorOf(rec[k][0]),
        border: i === 0 ? '0' : '0.5px solid #38383A'
      }));
    const front = this.state.view === 'front';
    return {
      c, tired,
      isFront: front, isBack: !front,
      frontBg: front ? '#636366' : 'transparent',
      backBg: front ? 'transparent' : '#636366',
      frontPressed: front ? 'true' : 'false',
      backPressed: front ? 'false' : 'true',
      showFront: () => this.setState({ view: 'front' }),
      showBack: () => this.setState({ view: 'back' }),
      figureLabel: front
        ? 'Mặt trước: ngực mỏi nặng 35 %, vai trước 55 %, đùi trước sẵn sàng'
        : 'Mặt sau: tay sau 48 %, xô 62 %, mông sẵn sàng'
    };
  }
}
</script>
