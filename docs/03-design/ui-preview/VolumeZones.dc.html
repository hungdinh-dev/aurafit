<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>AuraFit – Khối lượng tuần theo ngưỡng</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;background:#000}
a{color:#4BE3A7}a:hover{color:#7BF0C2}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #000000; color: #FFFFFF; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', 'Segoe UI', Roboto, sans-serif; box-sizing: border-box">
  <div style="padding: 12px 16px 0; display: flex; flex-direction: column; gap: 12px">
    <div style="display: flex">
      <a href="MuscleMap.dc.html" aria-label="Quay lại bản đồ cơ" style="width: 44px; height: 44px; border-radius: 22px; color: #FFFFFF; display: flex; align-items: center; justify-content: center; background: rgba(58,58,64,0.45); border: 0.5px solid rgba(255,255,255,0.22)">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a>
    </div>
    <div style="display: flex; flex-direction: column; gap: 2px; margin-top: -6px">
      <h1 style="margin: 0; font-size: 30px; font-weight: 700">Khối lượng tuần</h1>
      <span style="font-size: 15px; color: #A1A1A8">9–15/11 · số set hiệu quả mỗi nhóm cơ</span>
    </div>

    <div style="display: flex; gap: 12px; font-size: 12px; color: #A1A1A8; padding-left: 4px">
      <span style="display: flex; align-items: center; gap: 6px"><span style="width: 12px; height: 12px; border-radius: 3px; background: #1B2A4A"></span>Dưới mức kích thích</span>
      <span style="display: flex; align-items: center; gap: 6px"><span style="width: 12px; height: 12px; border-radius: 3px; background: #173A2C"></span>Hiệu quả</span>
      <span style="display: flex; align-items: center; gap: 6px"><span style="width: 12px; height: 12px; border-radius: 3px; background: #3D2614"></span>Nguy cơ quá tải</span>
    </div>

    <section style="background: #1C1C1E; border-radius: 26px; padding: 6px 0">
      <sc-for list="{{ rows }}" as="r" hint-placeholder-count="9">
        <button onClick="{{ r.pick }}" aria-pressed="{{ r.pressed }}" aria-label="{{ r.aria }}" style="width: 100%; display: flex; align-items: center; gap: 10px; min-height: 46px; padding: 0 16px; border: 0; background: {{ r.bg }}; color: #FFFFFF; font-family: inherit">
          <span style="width: 74px; text-align: left; font-size: 15px">{{ r.name }}</span>
          <span style="position: relative; flex: 1; height: 18px; display: flex; border-radius: 5px; overflow: hidden">
            <span style="width: 33.3%; background: #1B2A4A"></span><span style="width: 33.3%; background: #173A2C"></span><span style="flex: 1; background: #3D2614"></span>
            <span style="position: absolute; left: 0; top: 4px; height: 10px; width: {{ r.w }}; border-radius: 4px; background: {{ r.color }}"></span>
          </span>
          <span style="width: 26px; text-align: right; font: 700 16px ui-rounded, 'SF Pro Rounded', -apple-system, sans-serif; color: {{ r.color }}">{{ r.sets }}</span>
        </button>
      </sc-for>
      <div style="display: flex; justify-content: space-between; padding: 4px 16px 6px 100px; font-size: 11px; color: #8E8E93"><span>0</span><span>10</span><span>20</span><span>30</span></div>
    </section>

    <div style="padding: 12px 14px; border-radius: 18px; background: {{ tipBg }}; font-size: 15px; line-height: 1.45; color: {{ tipColor }}">{{ tip }}</div>
    <span style="font-size: 12px; color: #8E8E93; line-height: 1.4; padding: 0 4px">Ngưỡng khởi điểm 10–20 set/tuần theo các phân tích gộp về liều – đáp ứng (Schoenfeld 2017; Pelland 2026). App chỉnh dần theo tiến bộ và độ hồi phục của bạn.</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { sel: 0 };
  }
  renderVals() {
    const D = [['Ngực', 22], ['Lưng', 18], ['Vai', 12], ['Tay trước', 8], ['Tay sau', 12], ['Cẳng tay', 4], ['Bụng', 10], ['Mông', 13], ['Chân', 16]];
    const zone = (n) => n < 10 ? 'low' : n <= 20 ? 'ok' : 'high';
    const col = { low: '#5A8CFF', ok: '#4BE3A7', high: '#FF9F0A' };
    const rows = D.map(([name, sets], i) => {
      const z = zone(sets);
      return {
        name, sets, color: col[z], w: Math.min(100, (sets / 30) * 100) + '%',
        aria: name + ' ' + sets + ' set',
        pressed: this.state.sel === i ? 'true' : 'false',
        bg: this.state.sel === i ? '#2C2C2E' : 'transparent',
        pick: () => this.setState({ sel: i })
      };
    });
    const [n, s] = D[this.state.sel];
    const z = zone(s);
    const tips = {
      low: n + ': ' + s + ' set – dưới mức kích thích. Tuần sau app thêm 2–4 set (ví dụ 1 bài phụ) để vào vùng hiệu quả.',
      ok: n + ': ' + s + ' set – trong vùng hiệu quả. Giữ nguyên, tăng tải bằng tạ/rep.',
      high: n + ': ' + s + ' set – trên 20 set, có nguy cơ quá tải và hồi phục chậm. Nếu phần cơ này còn đỏ trên bản đồ phục hồi, tuần sau giảm 2–4 set.'
    };
    return {
      rows, tip: tips[z],
      tipBg: z === 'high' ? '#2A1D10' : z === 'low' ? '#13263D' : '#12221D',
      tipColor: z === 'high' ? '#FFC58A' : z === 'low' ? '#8CC8FF' : '#8FE3C1'
    };
  }
}
</script>
</body>
</html>
