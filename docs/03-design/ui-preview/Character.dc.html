<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>AuraFit – Chọn nhân vật</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;background:#000}
a{color:#4BE3A7}a:hover{color:#7BF0C2}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #000000; color: #FFFFFF; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', 'Segoe UI', Roboto, sans-serif; box-sizing: border-box">
  <div style="padding: 12px 16px 0; display: flex; flex-direction: column; gap: 20px">

    <div style="display: flex; align-items: center; gap: 14px">
      <button aria-label="Quay lại" style="width: 44px; height: 44px; border-radius: 22px; color: #FFFFFF; display: flex; align-items: center; justify-content: center; background: rgba(58,58,64,0.45); backdrop-filter: blur(28px) saturate(180%); -webkit-backdrop-filter: blur(28px) saturate(180%); border: 0.5px solid rgba(255,255,255,0.22); box-shadow: inset 0 1px 0 rgba(255,255,255,0.16)">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></button>
      <div role="progressbar" aria-label="Bước 5 trên 5" aria-valuenow="5" aria-valuemin="0" aria-valuemax="5" style="flex: 1; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 4px">
        <span style="height: 4px; border-radius: 2px; background: #4BE3A7"></span><span style="height: 4px; border-radius: 2px; background: #4BE3A7"></span><span style="height: 4px; border-radius: 2px; background: #4BE3A7"></span><span style="height: 4px; border-radius: 2px; background: #4BE3A7"></span><span style="height: 4px; border-radius: 2px; background: #4BE3A7"></span>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 6px">
      <h1 style="margin: 0; font-size: 30px; font-weight: 700; line-height: 1.15">Chọn người đồng hành</h1>
      <p style="margin: 0; font-size: 17px; color: #A1A1A8; line-height: 1.4">Hào quang sáng dần khi bạn sống khoẻ đều đặn. Đổi lúc nào cũng được.</p>
    </div>

    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
      <button onClick="{{ pickKai }}" aria-pressed="{{ kaiPressed }}" style="position: relative; border-radius: 26px; border: 0; background: #1C1C1E; box-shadow: {{ kaiRing }}; padding: 14px 8px 16px; display: flex; flex-direction: column; align-items: center; gap: 4px; color: #FFFFFF; font: 600 17px -apple-system, 'Segoe UI', sans-serif">
        <sc-if value="{{ isKai }}" hint-placeholder-val="{{ true }}">
          <span aria-hidden="true" style="position: absolute; top: 12px; right: 12px; width: 24px; height: 24px; border-radius: 12px; background: #4BE3A7; display: flex; align-items: center; justify-content: center"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#00140C" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"></path></svg></span>
        </sc-if>
        <svg width="120" height="140" viewBox="0 0 120 140" aria-hidden="true">
          <defs><radialGradient id="cK" cx="50%" cy="55%" r="50%"><stop offset="0%" stop-color="#4BE3A7" stop-opacity="0.6"></stop><stop offset="65%" stop-color="#4BE3A7" stop-opacity="0.12"></stop><stop offset="100%" stop-color="#4BE3A7" stop-opacity="0"></stop></radialGradient></defs>
          <ellipse cx="60" cy="78" rx="58" ry="62" fill="url(#cK)"></ellipse>
          <path d="M28 138 C28 104 42 94 60 94 C78 94 92 104 92 138 Z" fill="#3A3A3C"></path>
          <circle cx="60" cy="62" r="27" fill="#F2CFAE"></circle>
          <path d="M33 60 C31 38 47 29 61 30 C77 31 90 41 87 60 C82 50 74 45 62 46 C51 46 41 51 33 60 Z" fill="#1D1A2B"></path>
          <path d="M42 45 L48 34 L53 44 Z" fill="#1D1A2B"></path>
          <circle cx="50" cy="65" r="3.2" fill="#1A1A24"></circle><circle cx="70" cy="65" r="3.2" fill="#1A1A24"></circle>
          <path d="M53 75 Q60 81 67 75" fill="none" stroke="#1A1A24" stroke-width="2.4" stroke-linecap="round"></path>
        </svg>
        Kai<span style="font-size: 13px; font-weight: 400; color: #A1A1A8">Nam</span>
      </button>
      <button onClick="{{ pickMira }}" aria-pressed="{{ miraPressed }}" style="position: relative; border-radius: 26px; border: 0; background: #1C1C1E; box-shadow: {{ miraRing }}; padding: 14px 8px 16px; display: flex; flex-direction: column; align-items: center; gap: 4px; color: #FFFFFF; font: 600 17px -apple-system, 'Segoe UI', sans-serif">
        <sc-if value="{{ isMira }}" hint-placeholder-val="{{ false }}">
          <span aria-hidden="true" style="position: absolute; top: 12px; right: 12px; width: 24px; height: 24px; border-radius: 12px; background: #4BE3A7; display: flex; align-items: center; justify-content: center"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#00140C" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"></path></svg></span>
        </sc-if>
        <svg width="120" height="140" viewBox="0 0 120 140" aria-hidden="true">
          <defs><radialGradient id="cM" cx="50%" cy="55%" r="50%"><stop offset="0%" stop-color="#4BE3A7" stop-opacity="0.6"></stop><stop offset="65%" stop-color="#4BE3A7" stop-opacity="0.12"></stop><stop offset="100%" stop-color="#4BE3A7" stop-opacity="0"></stop></radialGradient></defs>
          <ellipse cx="60" cy="78" rx="58" ry="62" fill="url(#cM)"></ellipse>
          <path d="M31 64 C28 36 46 27 60 27 C75 27 93 36 89 64 L92 100 C85 97 81 90 80 84 L40 84 C39 90 35 97 28 100 Z" fill="#4A2A3F"></path>
          <path d="M28 138 C28 104 42 94 60 94 C78 94 92 104 92 138 Z" fill="#3A3A3C"></path>
          <circle cx="60" cy="62" r="27" fill="#F5D5B8"></circle>
          <path d="M35 60 C36 40 50 33 61 33 C74 34 86 42 85 58 C77 50 68 46 56 49 C48 51 41 55 35 60 Z" fill="#4A2A3F"></path>
          <circle cx="81" cy="45" r="4" fill="#4BE3A7"></circle>
          <circle cx="50" cy="65" r="3.2" fill="#1A1A24"></circle><circle cx="70" cy="65" r="3.2" fill="#1A1A24"></circle>
          <path d="M53 75 Q60 81 67 75" fill="none" stroke="#1A1A24" stroke-width="2.4" stroke-linecap="round"></path>
        </svg>
        Mira<span style="font-size: 13px; font-weight: 400; color: #A1A1A8">Nữ</span>
      </button>
    </div>

    <div style="display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 0 16px; border-radius: 26px; background: #1C1C1E">
      <label for="nm" style="font-size: 17px">Tên</label>
      <input id="nm" value="{{ charName }}" style="flex: 1; min-width: 0; border: 0; background: none; color: #A1A1A8; text-align: right; font: 400 17px -apple-system, 'Segoe UI', sans-serif; outline: none">
    </div>

    <fieldset style="margin: 0; border: 0; padding: 0; display: flex; flex-direction: column; gap: 10px">
      <legend style="font-size: 13px; color: #A1A1A8; padding: 0 0 8px 16px">Giọng nói chuyện</legend>
      <div style="display: flex; padding: 2px; border-radius: 10px; background: rgba(118,118,128,0.24)">
        <sc-for list="{{ voices }}" as="v" hint-placeholder-count="3">
          <button onClick="{{ v.pick }}" aria-pressed="{{ v.pressed }}" style="flex: 1; height: 32px; border: 0; border-radius: 8px; background: {{ v.bg }}; color: #FFFFFF; font: {{ v.weight }} 13px -apple-system, 'Segoe UI', sans-serif; box-shadow: {{ v.shadow }}">{{ v.label }}</button>
        </sc-for>
      </div>
      <p style="margin: 0; padding: 0 16px; font-size: 15px; line-height: 1.45; color: #EBEBF5"><span style="color: #4BE3A7; font-weight: 600">{{ charName }}</span> · {{ sample }}</p>
    </fieldset>
  </div>

  <div style="position: absolute; left: 16px; right: 16px; bottom: 26px">
    <a href="Main.dc.html" style="height: 56px; border-radius: 28px; display: flex; align-items: center; justify-content: center; color: #00140C; font-size: 17px; font-weight: 600; text-decoration: none; background: rgba(75,227,167,0.9); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 0.5px solid rgba(255,255,255,0.45); box-shadow: inset 0 1px 0 rgba(255,255,255,0.5), 0 10px 26px rgba(75,227,167,0.25)">Bắt đầu cùng {{ charName }}</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { character: 'Kai', voice: 'Bestie' };
  }
  renderVals() {
    const isKai = this.state.character === 'Kai';
    const samples = {
      Bestie: 'Nước chưa uống mà đòi glow up hả? Làm ly 250 ml nha.',
      Coach: 'Nước: 1,2 / 2,6 L. Uống 250 ml ngay để giữ tiến độ.',
      Drama: 'Mình đang khô héo như cây xương rồng… cứu bằng một ly nước đi!'
    };
    const voices = ['Bestie', 'Coach', 'Drama'].map((label) => {
      const on = this.state.voice === label;
      return {
        label,
        pressed: on ? 'true' : 'false',
        bg: on ? '#636366' : 'transparent',
        weight: on ? '600' : '500',
        shadow: on ? '0 3px 8px rgba(0,0,0,0.25)' : 'none',
        pick: () => this.setState({ voice: label })
      };
    });
    const ring = 'inset 0 0 0 2px #4BE3A7';
    return {
      isKai, isMira: !isKai,
      charName: isKai ? 'Kai' : 'Mira',
      kaiRing: isKai ? ring : 'none',
      miraRing: isKai ? 'none' : ring,
      kaiPressed: isKai ? 'true' : 'false',
      miraPressed: isKai ? 'false' : 'true',
      pickKai: () => this.setState({ character: 'Kai' }),
      pickMira: () => this.setState({ character: 'Mira' }),
      voices,
      sample: samples[this.state.voice]
    };
  }
}
</script>
</body>
</html>
