<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>AuraFit – Chi tiết bài tập</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;background:#000}
a{color:#4BE3A7}a:hover{color:#7BF0C2}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #000000; color: #FFFFFF; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', 'Segoe UI', Roboto, sans-serif; box-sizing: border-box">
  <div style="padding: 12px 16px 0; display: flex; flex-direction: column; gap: 14px">

    <div role="img" aria-label="Ảnh động hướng dẫn Bench Press" style="position: relative; height: 230px; margin: -12px -16px 0; background: #1C1C1E; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; color: #8E8E93">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5.5v13l10.5-6.5z"></path></svg>
      <span style="font-size: 13px">GIF hướng dẫn · nguồn có giấy phép</span>
      <a href="Library.dc.html" aria-label="Quay lại" style="position: absolute; left: 16px; top: 12px; width: 44px; height: 44px; border-radius: 22px; color: #FFFFFF; display: flex; align-items: center; justify-content: center; background: rgba(58,58,64,0.45); backdrop-filter: blur(28px) saturate(180%); -webkit-backdrop-filter: blur(28px) saturate(180%); border: 0.5px solid rgba(255,255,255,0.22); box-shadow: inset 0 1px 0 rgba(255,255,255,0.16)">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a>
      <span style="position: absolute; right: 16px; bottom: 12px; height: 28px; padding: 0 10px; border-radius: 14px; display: flex; align-items: center; font-size: 12px; font-weight: 600; color: #FFFFFF; background: rgba(40,40,46,0.5); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 0.5px solid rgba(255,255,255,0.22)">0,5×  ·  1×</span>
    </div>

    <div style="display: flex; gap: 12px; align-items: flex-start">
      <div style="flex: 1; display: flex; flex-direction: column; gap: 4px">
        <h1 style="margin: 0; font-size: 26px; font-weight: 700; line-height: 1.2">Đẩy ngực ngang tạ đòn</h1>
        <span style="font-size: 15px; color: #A1A1A8">Barbell Bench Press · Tạ đòn · Cơ bản</span>
        <div style="display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px">
          <span style="height: 28px; padding: 0 12px; border-radius: 14px; display: flex; align-items: center; font-size: 13px; font-weight: 600; background: #FF453A; color: #FFFFFF">Ngực</span>
          <span style="height: 28px; padding: 0 12px; border-radius: 14px; display: flex; align-items: center; font-size: 13px; background: #2C2C2E; color: #EBEBF5">Vai trước</span>
          <span style="height: 28px; padding: 0 12px; border-radius: 14px; display: flex; align-items: center; font-size: 13px; background: #2C2C2E; color: #EBEBF5">Tay sau</span>
        </div>
      </div>
      <svg width="66" height="138" viewBox="0 0 200 420" role="img" aria-label="Cơ chính: ngực; cơ phụ: vai trước, tay sau">
        <circle cx="100" cy="28" r="16" fill="#262628"></circle>
        <g fill="#3A3A3C">
          <path d="M92 50 C88 58 80 63 70 66 L90 66 C94 62 95 56 95 50 Z"></path>
          <path d="M58 68 C47 69 40 76 38 88 C37 96 39 102 42 106 C42 94 47 80 58 68 Z"></path>
          <path d="M66 72 C58 73 52 80 50 90 C49 97 50 103 52 107 C58 99 63 91 66 84 C68 79 68 75 66 72 Z" fill="#A8504B"></path>
          <path d="M98 74 L98 110 C89 114 79 112 72 105 C67 98 67 88 70 81 C77 75 87 72 98 74 Z" fill="#FF453A"></path>
          <path d="M50 112 C44 118 42 130 43 142 C44 148 47 152 50 152 C54 146 56 134 55 122 C54 116 52 112 50 112 Z"></path>
          <path d="M40 114 C36 124 35 136 37 146 C38 138 39 126 40 114 Z" fill="#A8504B"></path>
          <path d="M46 158 C40 170 34 188 30 208 C32 210 34 210 35 208 C40 190 46 174 49 162 Z"></path>
          <path d="M52 160 C50 176 44 194 38 210 C40 212 42 212 43 210 C49 194 54 178 55 164 Z"></path>
          <path d="M84 142 C79 152 77 166 79 180 C81 186 84 190 86 190 C85 172 85 154 86 144 Z"></path>
          <rect x="88" y="118" width="10" height="14" rx="4"></rect><rect x="88" y="135" width="10" height="14" rx="4"></rect><rect x="88" y="152" width="10" height="14" rx="4"></rect>
          <path d="M88 169 L98 169 L98 198 C94 198 90 192 88 182 Z"></path>
          <path d="M84 206 C78 226 77 260 80 292 C82 300 86 302 88 296 C90 266 90 232 88 210 Z"></path>
          <path d="M74 204 C66 226 64 262 68 298 C70 306 74 308 76 300 C74 270 74 236 79 208 Z"></path>
          <path d="M84 344 C82 362 82 382 84 398 C86 398 88 382 88 362 Z"></path>
          <path d="M76 344 C72 360 72 380 76 396 C78 384 79 362 80 346 Z"></path>
        </g>
        <g fill="#3A3A3C" transform="matrix(-1 0 0 1 200 0)">
          <path d="M92 50 C88 58 80 63 70 66 L90 66 C94 62 95 56 95 50 Z"></path>
          <path d="M58 68 C47 69 40 76 38 88 C37 96 39 102 42 106 C42 94 47 80 58 68 Z"></path>
          <path d="M66 72 C58 73 52 80 50 90 C49 97 50 103 52 107 C58 99 63 91 66 84 C68 79 68 75 66 72 Z" fill="#A8504B"></path>
          <path d="M98 74 L98 110 C89 114 79 112 72 105 C67 98 67 88 70 81 C77 75 87 72 98 74 Z" fill="#FF453A"></path>
          <path d="M50 112 C44 118 42 130 43 142 C44 148 47 152 50 152 C54 146 56 134 55 122 C54 116 52 112 50 112 Z"></path>
          <path d="M40 114 C36 124 35 136 37 146 C38 138 39 126 40 114 Z" fill="#A8504B"></path>
          <path d="M46 158 C40 170 34 188 30 208 C32 210 34 210 35 208 C40 190 46 174 49 162 Z"></path>
          <path d="M52 160 C50 176 44 194 38 210 C40 212 42 212 43 210 C49 194 54 178 55 164 Z"></path>
          <path d="M84 142 C79 152 77 166 79 180 C81 186 84 190 86 190 C85 172 85 154 86 144 Z"></path>
          <rect x="88" y="118" width="10" height="14" rx="4"></rect><rect x="88" y="135" width="10" height="14" rx="4"></rect><rect x="88" y="152" width="10" height="14" rx="4"></rect>
          <path d="M88 169 L98 169 L98 198 C94 198 90 192 88 182 Z"></path>
          <path d="M84 206 C78 226 77 260 80 292 C82 300 86 302 88 296 C90 266 90 232 88 210 Z"></path>
          <path d="M74 204 C66 226 64 262 68 298 C70 306 74 308 76 300 C74 270 74 236 79 208 Z"></path>
          <path d="M84 344 C82 362 82 382 84 398 C86 398 88 382 88 362 Z"></path>
          <path d="M76 344 C72 360 72 380 76 396 C78 384 79 362 80 346 Z"></path>
        </g>
      </svg>
    </div>

    <div role="group" aria-label="Nội dung" style="display: flex; padding: 2px; border-radius: 10px; background: rgba(118,118,128,0.24)">
      <button onClick="{{ showGuide }}" aria-pressed="{{ guidePressed }}" style="flex: 1; height: 32px; border: 0; border-radius: 8px; background: {{ guideBg }}; color: #FFFFFF; font: 600 13px -apple-system, 'Segoe UI', sans-serif">Hướng dẫn</button>
      <button onClick="{{ showHistory }}" aria-pressed="{{ historyPressed }}" style="flex: 1; height: 32px; border: 0; border-radius: 8px; background: {{ historyBg }}; color: #FFFFFF; font: 600 13px -apple-system, 'Segoe UI', sans-serif">Lịch sử của bạn</button>
    </div>

    <sc-if value="{{ isGuide }}" hint-placeholder-val="{{ true }}">
      <ol style="margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 12px">
        <sc-for list="{{ steps }}" as="s" hint-placeholder-count="4">
          <li style="display: flex; gap: 12px; font-size: 15px; line-height: 1.45; color: #EBEBF5">
            <span style="width: 24px; height: 24px; border-radius: 12px; background: #2C2C2E; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font: 600 13px ui-rounded, 'SF Pro Rounded', -apple-system, sans-serif">{{ s.n }}</span>{{ s.text }}</li>
        </sc-for>
      </ol>
    </sc-if>
    <sc-if value="{{ isHistory }}" hint-placeholder-val="{{ false }}">
      <section style="background: #1C1C1E; border-radius: 26px; overflow: hidden">
        <div style="display: flex; align-items: center; min-height: 52px; padding: 0 16px"><span style="flex: 1; font-size: 17px">Kỷ lục (PR)</span><span style="font: 600 17px ui-rounded, 'SF Pro Rounded', -apple-system, sans-serif">60 kg × 10</span></div>
        <div style="display: flex; align-items: center; min-height: 52px; padding: 0 16px; border-top: 0.5px solid #38383A"><span style="flex: 1; font-size: 17px">1RM ước tính</span><span style="font: 600 17px ui-rounded, 'SF Pro Rounded', -apple-system, sans-serif">80 kg</span></div>
        <sc-for list="{{ history }}" as="h" hint-placeholder-count="3">
          <div style="display: flex; align-items: center; min-height: 52px; padding: 0 16px; border-top: 0.5px solid #38383A"><span style="flex: 1; font-size: 15px; color: #A1A1A8">{{ h.date }}</span><span style="font-size: 15px">{{ h.sets }}</span></div>
        </sc-for>
      </section>
    </sc-if>
  </div>

  <div style="position: absolute; left: 16px; right: 16px; bottom: 26px">
    <a href="Workout.dc.html" style="height: 56px; border-radius: 28px; display: flex; align-items: center; justify-content: center; color: #00140C; font-size: 17px; font-weight: 600; text-decoration: none; background: rgba(75,227,167,0.9); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 0.5px solid rgba(255,255,255,0.45); box-shadow: inset 0 1px 0 rgba(255,255,255,0.5), 0 10px 26px rgba(75,227,167,0.25)">Thêm vào buổi tập</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { tab: 'guide' };
  }
  renderVals() {
    const guide = this.state.tab === 'guide';
    const steps = [
      'Nằm ngửa trên ghế phẳng, mắt ngay dưới thanh đòn, hai bàn chân đặt chắc trên sàn.',
      'Nắm thanh rộng hơn vai một chút, kéo bả vai ra sau và xuống.',
      'Hạ thanh chậm xuống giữa ngực, khuỷu tay chếch khoảng 45° so với thân.',
      'Đẩy thanh lên đến khi gần thẳng tay, thở ra, giữ lưng và mông áp ghế.'
    ].map((text, i) => ({ n: i + 1, text }));
    return {
      steps,
      history: [
        { date: 'Hôm nay', sets: '60 × 10 · 60 × 10 · 62,5 × 9' },
        { date: 'Thứ Hai 9/11', sets: '57,5 × 10 · 57,5 × 10 · 60 × 8' },
        { date: 'Thứ Năm 5/11', sets: '57,5 × 9 · 57,5 × 8 · 55 × 10' }
      ],
      isGuide: guide, isHistory: !guide,
      guideBg: guide ? '#636366' : 'transparent',
      historyBg: guide ? 'transparent' : '#636366',
      guidePressed: guide ? 'true' : 'false',
      historyPressed: guide ? 'false' : 'true',
      showGuide: () => this.setState({ tab: 'guide' }),
      showHistory: () => this.setState({ tab: 'history' })
    };
  }
}
</script>
</body>
</html>
