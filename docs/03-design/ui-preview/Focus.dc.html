<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>AuraFit – Làm việc tập trung</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;background:#000}
a{color:#4BE3A7}a:hover{color:#7BF0C2}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #000000; color: #FFFFFF; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', 'Segoe UI', Roboto, sans-serif; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; padding: 12px 16px 30px">
  <div style="align-self: stretch; display: flex">
    <a href="Tasks.dc.html" aria-label="Thu nhỏ" style="width: 44px; height: 44px; border-radius: 22px; color: #FFFFFF; display: flex; align-items: center; justify-content: center; background: rgba(58,58,64,0.45); border: 0.5px solid rgba(255,255,255,0.22)">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 9l7 7 7-7"></path></svg></a>
  </div>
  <span style="margin-top: 24px; font-size: 15px; color: #A1A1A8">Làm việc tập trung · phiên 2/2</span>

  <div style="position: relative; width: 280px; height: 280px; margin-top: 28px">
    <svg width="280" height="280" viewBox="0 0 280 280" aria-hidden="true">
      <circle cx="140" cy="140" r="124" fill="none" stroke="#1C1C1E" stroke-width="14"></circle>
      <circle cx="140" cy="140" r="124" fill="none" stroke="#4BE3A7" stroke-width="14" stroke-linecap="round" stroke-dasharray="501 779" transform="rotate(-90 140 140)"></circle>
    </svg>
    <div style="position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px">
      <span aria-live="polite" style="font: 600 64px/1 ui-rounded, 'SF Pro Rounded', -apple-system, sans-serif; letter-spacing: -0.02em">32:15</span>
      <span style="font-size: 15px; color: {{ stateColor }}">{{ stateText }}</span>
    </div>
  </div>

  <div style="display: flex; gap: 24px; margin-top: 36px">
    <button aria-label="Dừng phiên" style="width: 72px; height: 72px; border-radius: 36px; color: #FFFFFF; display: flex; align-items: center; justify-content: center; background: rgba(72,72,78,0.5); border: 0.5px solid rgba(255,255,255,0.22)">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="2"></rect></svg></button>
    <button onClick="{{ toggle }}" aria-label="{{ toggleLabel }}" style="width: 72px; height: 72px; border-radius: 36px; color: #00140C; display: flex; align-items: center; justify-content: center; background: rgba(75,227,167,0.9); border: 0.5px solid rgba(255,255,255,0.45)">
      <sc-if value="{{ running }}" hint-placeholder-val="{{ true }}">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1"></rect><rect x="14" y="5" width="4" height="14" rx="1"></rect></svg>
      </sc-if>
      <sc-if value="{{ paused }}" hint-placeholder-val="{{ false }}">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5.5v13l10.5-6.5z"></path></svg>
      </sc-if>
    </button>
  </div>

  <section style="align-self: stretch; margin-top: auto; background: #1C1C1E; border-radius: 26px; overflow: hidden">
    <div style="display: flex; align-items: center; min-height: 52px; padding: 0 16px"><span style="flex: 1; font-size: 17px">Không làm phiền</span><span style="font-size: 15px; color: #A1A1A8">giờ làm việc 9:00–17:30</span></div>
    <div style="display: flex; align-items: center; min-height: 52px; padding: 0 16px; border-top: 0.5px solid #38383A"><span style="flex: 1; font-size: 17px">Khi hết giờ</span><span style="font-size: 15px; color: #A1A1A8">thông báo + rung</span></div>
  </section>
  <span style="margin-top: 10px; font-size: 13px; color: #8E8E93">Khoá màn hình vẫn đếm tiếp.</span>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { running: true };
  }
  renderVals() {
    const r = this.state.running;
    return {
      running: r, paused: !r,
      stateText: r ? 'đang tập trung' : 'tạm dừng',
      stateColor: r ? '#4BE3A7' : '#FFD60A',
      toggleLabel: r ? 'Tạm dừng' : 'Tiếp tục',
      toggle: () => this.setState({ running: !r })
    };
  }
}
</script>
</body>
</html>
