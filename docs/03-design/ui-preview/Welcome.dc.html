<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>AuraFit – Chào mừng</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;background:#000}
a{color:#4BE3A7}a:hover{color:#7BF0C2}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #000000; color: #FFFFFF; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', 'Segoe UI', Roboto, sans-serif; box-sizing: border-box; display: flex; flex-direction: column; padding: 12px 20px 30px">

  <div style="display: flex; justify-content: flex-end">
    <div role="group" aria-label="Ngôn ngữ" style="display: flex; padding: 2px; border-radius: 10px; background: rgba(118,118,128,0.24)">
      <button onClick="{{ toVi }}" aria-pressed="{{ viPressed }}" style="width: 48px; height: 32px; border: 0; border-radius: 8px; background: {{ viBg }}; color: #FFFFFF; font: 600 13px -apple-system, 'Segoe UI', sans-serif">VI</button>
      <button onClick="{{ toEn }}" aria-pressed="{{ enPressed }}" style="width: 48px; height: 32px; border: 0; border-radius: 8px; background: {{ enBg }}; color: #FFFFFF; font: 600 13px -apple-system, 'Segoe UI', sans-serif">EN</button>
    </div>
  </div>

  <div style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; text-align: center">
    <svg width="168" height="168" viewBox="0 0 168 168" aria-hidden="true">
      <defs><radialGradient id="wg" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#4BE3A7" stop-opacity="0.55"></stop><stop offset="70%" stop-color="#4BE3A7" stop-opacity="0.08"></stop><stop offset="100%" stop-color="#4BE3A7" stop-opacity="0"></stop></radialGradient></defs>
      <circle cx="84" cy="84" r="84" fill="url(#wg)"></circle>
      <circle cx="84" cy="84" r="46" fill="none" stroke="#4BE3A7" stroke-width="6"></circle>
      <circle cx="84" cy="84" r="26" fill="#4BE3A7"></circle>
    </svg>
    <span style="font-size: 40px; font-weight: 800; letter-spacing: -0.02em">AuraFit</span>
    <h1 style="margin: 0; font-size: 24px; font-weight: 700; line-height: 1.25">{{ t.title }}</h1>
    <p style="margin: 0; font-size: 17px; color: #A1A1A8; line-height: 1.45">{{ t.sub }}</p>
  </div>

  <div style="display: flex; flex-direction: column; gap: 12px">
    <sc-if value="{{ isStart }}" hint-placeholder-val="{{ true }}">
      <a href="OnbBody.dc.html" style="height: 56px; border-radius: 28px; background: #FFFFFF; color: #000000; display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 17px; font-weight: 600; text-decoration: none">
        <span aria-hidden="true" style="width: 22px; height: 22px; border-radius: 11px; border: 2px solid #000000; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 800">G</span>{{ t.google }}</a>
      <button onClick="{{ toEmail }}" style="height: 56px; border-radius: 28px; color: #FFFFFF; font: 600 17px -apple-system, 'Segoe UI', sans-serif; background: rgba(72,72,78,0.5); border: 0.5px solid rgba(255,255,255,0.22)">{{ t.email }}</button>
    </sc-if>
    <sc-if value="{{ isEmail }}" hint-placeholder-val="{{ false }}">
      <label for="em" style="font-size: 13px; color: #A1A1A8; padding-left: 4px">{{ t.emailLabel }}</label>
      <input id="em" type="email" value="ban@vidu.com" style="height: 52px; border-radius: 14px; border: 0; background: #1C1C1E; color: #FFFFFF; padding: 0 16px; font: 400 17px -apple-system, 'Segoe UI', sans-serif; outline: none">
      <span style="font-size: 13px; color: #A1A1A8; padding-left: 4px">{{ t.otp }}</span>
      <div style="display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px">
        <sc-for list="{{ otp }}" as="d" hint-placeholder-count="6">
          <span style="height: 52px; border-radius: 12px; background: #1C1C1E; display: flex; align-items: center; justify-content: center; font: 600 22px ui-rounded, 'SF Pro Rounded', -apple-system, sans-serif">{{ d.v }}</span>
        </sc-for>
      </div>
      <a href="OnbBody.dc.html" style="height: 56px; border-radius: 28px; display: flex; align-items: center; justify-content: center; color: #00140C; font-size: 17px; font-weight: 600; text-decoration: none; background: rgba(75,227,167,0.9); border: 0.5px solid rgba(255,255,255,0.45)">{{ t.verify }}</a>
    </sc-if>
    <p style="margin: 4px 0 0; font-size: 12px; color: #8E8E93; text-align: center; line-height: 1.4">{{ t.legal }}</p>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { lang: 'vi', step: 'start' };
  }
  renderVals() {
    const T = {
      vi: { title: 'Sống khoẻ mỗi ngày, thấy hào quang lớn dần', sub: 'Chụp bữa ăn, ngủ đủ, tập đều – AuraFit lo phần tính toán.', google: 'Tiếp tục với Google', email: 'Tiếp tục với email', emailLabel: 'Email', otp: 'Nhập mã 6 số đã gửi tới email', verify: 'Xác nhận', legal: 'Tiếp tục nghĩa là bạn đồng ý Điều khoản và Chính sách quyền riêng tư.' },
      en: { title: 'Live well every day, watch your aura grow', sub: 'Snap meals, sleep enough, train consistently – AuraFit does the math.', google: 'Continue with Google', email: 'Continue with email', emailLabel: 'Email', otp: 'Enter the 6-digit code we emailed you', verify: 'Verify', legal: 'By continuing you agree to the Terms and Privacy Policy.' }
    };
    const vi = this.state.lang === 'vi';
    const start = this.state.step === 'start';
    return {
      t: T[this.state.lang],
      isStart: start, isEmail: !start,
      otp: ['4', '8', '2', '', '', ''].map((v) => ({ v })),
      viBg: vi ? '#636366' : 'transparent', enBg: vi ? 'transparent' : '#636366',
      viPressed: vi ? 'true' : 'false', enPressed: vi ? 'false' : 'true',
      toVi: () => this.setState({ lang: 'vi' }),
      toEn: () => this.setState({ lang: 'en' }),
      toEmail: () => this.setState({ step: 'email' })
    };
  }
}
</script>
</body>
</html>
