<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>AuraFit – Mô tả bữa ăn</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;background:#000}
a{color:#4BE3A7}a:hover{color:#7BF0C2}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #000000; color: #FFFFFF; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', 'Segoe UI', Roboto, sans-serif; box-sizing: border-box">
  <div style="position: absolute; left: 0; right: 0; top: 10px; bottom: 0; background: #1C1C1E; border-radius: 38px 38px 0 0; padding: 8px 16px 0; display: flex; flex-direction: column; gap: 14px; box-sizing: border-box">
    <span aria-hidden="true" style="align-self: center; width: 36px; height: 5px; border-radius: 3px; background: #48484A"></span>
    <header style="display: flex; align-items: center; gap: 8px">
      <a href="AddFood.dc.html" aria-label="Quay lại" style="width: 44px; height: 44px; border-radius: 22px; background: #2C2C2E; color: #EBEBF5; display: flex; align-items: center; justify-content: center">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a>
      <h1 style="margin: 0; flex: 1; text-align: center; font-size: 17px; font-weight: 600">Mô tả bữa ăn</h1>
      <span style="width: 44px"></span>
    </header>

    <label for="desc" style="font-size: 13px; color: #A1A1A8; padding-left: 4px">Bạn đã ăn gì? Gõ hoặc giữ nút micro để nói</label>
    <textarea id="desc" rows="3" style="border: 0; border-radius: 18px; background: #2C2C2E; color: #FFFFFF; padding: 14px 16px; font: 400 17px/1.45 -apple-system, 'Segoe UI', sans-serif; resize: none; outline: none">2 trứng luộc, 1 bát cơm, canh rau muống, 1 quả chuối</textarea>

    <div style="display: flex; gap: 10px">
      <button aria-label="Giữ để nói" style="width: 56px; height: 56px; border-radius: 28px; color: #FFFFFF; display: flex; align-items: center; justify-content: center; background: rgba(72,72,78,0.5); border: 0.5px solid rgba(255,255,255,0.22)">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"></rect><path d="M5 11a7 7 0 0 0 14 0M12 18v3"></path></svg></button>
      <button onClick="{{ analyze }}" style="flex: 1; height: 56px; border-radius: 28px; color: #00140C; font: 600 17px -apple-system, 'Segoe UI', sans-serif; background: rgba(75,227,167,0.9); border: 0.5px solid rgba(255,255,255,0.45)">{{ btn }}</button>
    </div>

    <sc-if value="{{ done }}" hint-placeholder-val="{{ true }}">
      <div style="display: flex; flex-direction: column; gap: 8px">
        <div style="display: flex; justify-content: space-between; padding: 0 4px; font-size: 13px; color: #A1A1A8"><span>Kết quả – sửa nếu chưa đúng</span><span>4 món</span></div>
        <section style="background: #2C2C2E; border-radius: 22px; overflow: hidden">
          <sc-for list="{{ items }}" as="i" hint-placeholder-count="4">
            <div style="display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 0 16px; border-top: {{ i.border }}">
              <span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 17px">{{ i.name }}</span><span style="font-size: 13px; color: #A1A1A8">{{ i.meta }}</span></span>
              <span style="font: 600 17px ui-rounded, 'SF Pro Rounded', -apple-system, sans-serif">{{ i.kcal }}</span>
            </div>
          </sc-for>
        </section>
        <div style="display: flex; justify-content: space-between; align-items: baseline; padding: 4px">
          <span style="font-size: 15px; color: #A1A1A8">Tổng · P 23 g · C 98 g · F 12 g</span>
          <span style="font: 700 24px ui-rounded, 'SF Pro Rounded', -apple-system, sans-serif">590 kcal</span>
        </div>
      </div>
    </sc-if>
  </div>

  <div style="position: absolute; left: 16px; right: 16px; bottom: 26px">
    <a href="Diary.dc.html" style="height: 56px; border-radius: 28px; display: flex; align-items: center; justify-content: center; color: #FFFFFF; font-size: 17px; font-weight: 600; text-decoration: none; background: rgba(72,72,78,0.5); border: 0.5px solid rgba(255,255,255,0.22)">Lưu bữa tối</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { done: true };
  }
  renderVals() {
    const items = [
      { name: 'Trứng gà luộc × 2', meta: '2 quả · P 12 g', kcal: '140' },
      { name: 'Cơm trắng', meta: '1 bát vừa · C 56 g', kcal: '260' },
      { name: 'Canh rau muống', meta: '1 bát · có nước dùng', kcal: '85' },
      { name: 'Chuối', meta: '1 quả vừa · Đường 14 g', kcal: '105' }
    ].map((i, idx) => Object.assign(i, { border: idx === 0 ? '0' : '0.5px solid #48484A' }));
    return {
      items, done: this.state.done,
      btn: this.state.done ? 'Phân tích lại' : 'Phân tích',
      analyze: () => this.setState({ done: true })
    };
  }
}
</script>
</body>
</html>
