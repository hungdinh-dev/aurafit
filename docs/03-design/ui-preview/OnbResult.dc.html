<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>AuraFit – Onboarding: mục tiêu và huấn luyện viên</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;background:#000}
a{color:#4BE3A7}a:hover{color:#7BF0C2}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #000000; color: #FFFFFF; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', 'Segoe UI', Roboto, sans-serif; box-sizing: border-box">
  <div style="padding: 12px 16px 0; display: flex; flex-direction: column; gap: 14px">
    <div style="display: flex; align-items: center; gap: 14px">
      <a href="OnbBody.dc.html" aria-label="Quay lại" style="width: 44px; height: 44px; border-radius: 22px; color: #FFFFFF; display: flex; align-items: center; justify-content: center; background: rgba(58,58,64,0.45); border: 0.5px solid rgba(255,255,255,0.22)">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a>
      <div role="progressbar" aria-label="Bước 3–4 trên 5" aria-valuenow="4" aria-valuemin="0" aria-valuemax="5" style="flex: 1; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 4px">
        <span style="height: 4px; border-radius: 2px; background: #4BE3A7"></span><span style="height: 4px; border-radius: 2px; background: #4BE3A7"></span><span style="height: 4px; border-radius: 2px; background: #4BE3A7"></span><span style="height: 4px; border-radius: 2px; background: #4BE3A7"></span><span style="height: 4px; border-radius: 2px; background: #3A3A3C"></span>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 2px">
      <span style="font-size: 15px; color: #A1A1A8">Mục tiêu mỗi ngày</span>
      <span style="font: 700 48px/1.05 ui-rounded, 'SF Pro Rounded', -apple-system, sans-serif">2.150 <span style="font-size: 20px; color: #A1A1A8">kcal</span></span>
    </div>

    <section style="background: #1C1C1E; border-radius: 22px; padding: 12px 16px; display: flex; flex-direction: column; gap: 6px; font-size: 15px">
      <div style="display: flex; justify-content: space-between"><span style="color: #A1A1A8">BMR (năng lượng nghỉ)</span><span>1.742</span></div>
      <div style="display: flex; justify-content: space-between"><span style="color: #A1A1A8">× 1,55 vận động vừa = TDEE</span><span>2.700</span></div>
      <div style="display: flex; justify-content: space-between"><span style="color: #A1A1A8">Giảm 0,5 kg/tuần</span><span>−550</span></div>
      <div style="display: flex; gap: 8px; flex-wrap: wrap; margin-top: 6px; font-size: 13px">
        <span style="padding: 4px 10px; border-radius: 12px; background: #2C2C2E">Protein 140 g</span>
        <span style="padding: 4px 10px; border-radius: 12px; background: #2C2C2E">Carb 230 g</span>
        <span style="padding: 4px 10px; border-radius: 12px; background: #2C2C2E">Fat 65 g</span>
        <span style="padding: 4px 10px; border-radius: 12px; background: #2C2C2E">Đường ≤ 50 g</span>
      </div>
    </section>

    <fieldset style="margin: 0; border: 0; padding: 0; display: flex; flex-direction: column; gap: 8px">
      <legend style="font-size: 13px; color: #A1A1A8; padding: 0 0 8px 16px">Huấn luyện viên khắt khe tới đâu?</legend>
      <sc-for list="{{ levels }}" as="l" hint-placeholder-count="3">
        <button onClick="{{ l.pick }}" aria-pressed="{{ l.pressed }}" style="display: flex; align-items: center; gap: 12px; min-height: 60px; padding: 0 16px; border: 0; border-radius: 18px; background: #1C1C1E; box-shadow: {{ l.ring }}; color: #FFFFFF; text-align: left; font-family: inherit">
          <span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 17px; font-weight: 600">{{ l.label }}</span><span style="font-size: 13px; color: #A1A1A8">{{ l.rule }}</span></span>
          <span style="width: 22px; height: 22px; border-radius: 11px; box-shadow: inset 0 0 0 2px {{ l.dot }}; background: {{ l.fill }}"></span>
        </button>
      </sc-for>
      <span style="font-size: 13px; color: #A1A1A8; padding-left: 16px">Đổi được tối đa 1 lần/tuần.</span>
    </fieldset>

    <div style="display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 0 8px 0 16px; border-radius: 22px; background: #1C1C1E">
      <span style="flex: 1; display: flex; flex-direction: column"><span style="font-size: 17px">Ngày tự do mỗi tuần</span><span style="font-size: 13px; color: #A1A1A8">Mặc định bù trong tuần</span></span>
      <button onClick="{{ minus }}" aria-label="Bớt một ngày" style="width: 44px; height: 44px; border: 0; border-radius: 22px; background: #2C2C2E; color: #FFFFFF; font: 600 22px -apple-system, sans-serif">−</button>
      <span style="width: 24px; text-align: center; font: 700 22px ui-rounded, 'SF Pro Rounded', -apple-system, sans-serif">{{ free }}</span>
      <button onClick="{{ plus }}" aria-label="Thêm một ngày" style="width: 44px; height: 44px; border: 0; border-radius: 22px; background: #2C2C2E; color: #FFFFFF; font: 600 22px -apple-system, sans-serif">+</button>
    </div>
  </div>

  <div style="position: absolute; left: 16px; right: 16px; bottom: 26px">
    <a href="Character.dc.html" style="height: 56px; border-radius: 28px; display: flex; align-items: center; justify-content: center; color: #00140C; font-size: 17px; font-weight: 600; text-decoration: none; background: rgba(75,227,167,0.9); border: 0.5px solid rgba(255,255,255,0.45)">Tiếp tục</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { level: 'Tiêu chuẩn', free: 1 };
  }
  renderVals() {
    const defs = [
      ['Nhẹ nhàng', 'kcal ±15 % · giữ streak từ 60 điểm · khiên tự bảo vệ', 2],
      ['Tiêu chuẩn', 'kcal ±10 % · giữ streak từ 70 điểm · khiên tự bảo vệ', 1],
      ['Khắc nghiệt', 'kcal ±5 % · giữ streak từ 80 điểm · tự dùng khiên', 0]
    ];
    const levels = defs.map(([label, rule, free]) => {
      const on = this.state.level === label;
      return {
        label, rule, pressed: on ? 'true' : 'false',
        ring: on ? 'inset 0 0 0 2px #4BE3A7' : 'none',
        dot: on ? '#4BE3A7' : '#48484A', fill: on ? '#4BE3A7' : 'transparent',
        pick: () => this.setState({ level: label, free })
      };
    });
    const f = this.state.free;
    return {
      levels, free: f,
      minus: () => this.setState({ free: Math.max(0, f - 1) }),
      plus: () => this.setState({ free: Math.min(3, f + 1) })
    };
  }
}
</script>
</body>
</html>
