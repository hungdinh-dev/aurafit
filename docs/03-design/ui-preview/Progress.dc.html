<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>AuraFit – Tiến độ</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;background:#000}
a{color:#4BE3A7}a:hover{color:#7BF0C2}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #000000; color: #FFFFFF; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', 'Segoe UI', Roboto, sans-serif; box-sizing: border-box">
  <div style="padding: 12px 16px 0; display: flex; flex-direction: column; gap: 14px">
    <div style="display: flex">
      <a href="Profile.dc.html" aria-label="Quay lại" style="width: 44px; height: 44px; border-radius: 22px; color: #FFFFFF; display: flex; align-items: center; justify-content: center; background: rgba(58,58,64,0.45); border: 0.5px solid rgba(255,255,255,0.22)">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a>
    </div>
    <h1 style="margin: -6px 0 0; font-size: 34px; font-weight: 700">Tiến độ</h1>

    <div role="group" aria-label="Khoảng thời gian" style="display: flex; padding: 2px; border-radius: 10px; background: rgba(118,118,128,0.24)">
      <sc-for list="{{ ranges }}" as="r" hint-placeholder-count="3">
        <button onClick="{{ r.pick }}" aria-pressed="{{ r.pressed }}" style="flex: 1; height: 32px; border: 0; border-radius: 8px; background: {{ r.bg }}; color: #FFFFFF; font: 600 13px -apple-system, 'Segoe UI', sans-serif">{{ r.label }}</button>
      </sc-for>
    </div>

    <section style="background: #1C1C1E; border-radius: 26px; padding: 16px; display: flex; flex-direction: column; gap: 10px">
      <div style="display: flex; justify-content: space-between; align-items: baseline"><span style="font-size: 17px; font-weight: 600">kcal trung bình / ngày</span><span style="font: 700 20px ui-rounded, 'SF Pro Rounded', -apple-system, sans-serif">{{ avg }}</span></div>
      <div role="img" aria-label="{{ chartLabel }}" style="position: relative; height: 120px; display: flex; align-items: flex-end; gap: {{ gap }}; padding-bottom: 18px; box-sizing: border-box">
        <span style="position: absolute; left: 0; right: 0; top: 23px; border-top: 1px dashed #8E8E93"></span>
        <sc-for list="{{ bars }}" as="b" hint-placeholder-count="7">
          <div style="flex: 1; position: relative; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; align-items: center">
            <span style="width: 100%; height: {{ b.h }}px; border-radius: 5px; background: {{ b.fill }}"></span>
            <span style="position: absolute; bottom: -18px; font-size: 10px; color: #A1A1A8">{{ b.label }}</span>
          </div>
        </sc-for>
      </div>
      <span style="font-size: 12px; color: #A1A1A8">Đường gạch: mục tiêu 2.150 · cam: vượt hơn 10 %</span>
    </section>

    <section style="background: #1C1C1E; border-radius: 26px; padding: 16px; display: flex; flex-direction: column; gap: 10px">
      <div style="display: flex; justify-content: space-between; align-items: baseline"><span style="font-size: 17px; font-weight: 600">Điểm ngày · 18 tuần</span><span style="font-size: 13px; color: #A1A1A8">TB 78</span></div>
      <div role="img" aria-label="Lịch điểm ngày 18 tuần, ô sáng là điểm cao" style="display: flex; gap: 3px">
        <sc-for list="{{ weeks }}" as="w" hint-placeholder-count="18">
          <div style="display: flex; flex-direction: column; gap: 3px">
            <sc-for list="{{ w.days }}" as="d" hint-placeholder-count="7">
              <span style="width: 15px; height: 15px; border-radius: 4px; background: {{ d.bg }}"></span>
            </sc-for>
          </div>
        </sc-for>
      </div>
    </section>

    <section style="background: #12221D; border-radius: 26px; padding: 14px 16px; display: flex; flex-direction: column; gap: 6px">
      <span style="font-size: 13px; color: #8FE3C1">Tổng kết tuần 9–15/11</span>
      <span style="font-size: 15px; line-height: 1.5; color: #E2F5EC">Điểm TB 81 · 5/7 ngày đạt · ngày tốt nhất Thứ Năm (96). Protein tăng 8 điểm, giấc ngủ giảm 3. Với nhịp này bạn chạm 65 kg vào khoảng <strong>14/03</strong>.</span>
    </section>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { range: 'Tuần' };
  }
  renderVals() {
    const D = {
      'Tuần': [['T2', 2050], ['T3', 2200], ['T4', 1980], ['T5', 2150], ['T6', 2420], ['T7', 2600], ['CN', 1900]],
      'Tháng': [['T1', 2180], ['T2', 2090], ['T3', 2240], ['T4', 2110]],
      'Năm': [['1', 2500], ['2', 2450], ['3', 2400], ['4', 2350], ['5', 2300], ['6', 2280], ['7', 2250], ['8', 2200], ['9', 2180], ['10', 2160], ['11', 2150], ['12', 0]]
    };
    const r = this.state.range;
    const max = 2800, H = 102, target = 2150;
    const data = D[r];
    const bars = data.map(([label, v]) => ({
      label, h: v === 0 ? 3 : Math.round((v / max) * H),
      fill: v === 0 ? '#3A3A3C' : v > target * 1.1 ? '#FFB36B' : '#4BE3A7'
    }));
    const vals = data.map((d) => d[1]).filter((v) => v > 0);
    const avg = Math.round(vals.reduce((a, b) => a + b, 0) / vals.length);
    const ranges = ['Tuần', 'Tháng', 'Năm'].map((label) => ({
      label, pressed: r === label ? 'true' : 'false', bg: r === label ? '#636366' : 'transparent',
      pick: () => this.setState({ range: label })
    }));
    const scale = ['#1C1C1E', '#1F3D33', '#2A6B54', '#38A57D', '#4BE3A7'];
    let seed = 11;
    const rnd = () => { seed = (seed * 9301 + 49297) % 233280; return seed / 233280; };
    const weeks = Array.from({ length: 18 }, (_, w) => ({
      days: Array.from({ length: 7 }, () => {
        const x = rnd() + w * 0.025;
        const l = x > 1.05 ? 4 : x > 0.8 ? 3 : x > 0.5 ? 2 : x > 0.25 ? 1 : 0;
        return { bg: scale[l] };
      })
    }));
    return {
      ranges, bars, weeks,
      avg: avg.toLocaleString('vi-VN'),
      gap: r === 'Năm' ? '6px' : '12px',
      chartLabel: 'Biểu đồ kcal theo ' + r.toLowerCase() + ', trung bình ' + avg + ' kcal'
    };
  }
}
</script>
</body>
</html>
