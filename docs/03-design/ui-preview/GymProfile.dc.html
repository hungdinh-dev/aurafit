<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>AuraFit – Phòng gym và máy tính bánh tạ</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;background:#000}
a{color:#4BE3A7}a:hover{color:#7BF0C2}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #000000; color: #FFFFFF; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', 'Segoe UI', Roboto, sans-serif; box-sizing: border-box">
  <div style="padding: 12px 16px 0; display: flex; flex-direction: column; gap: 14px">
    <div style="display: flex">
      <a href="TrainPlan.dc.html" aria-label="Quay lại" style="width: 44px; height: 44px; border-radius: 22px; color: #FFFFFF; display: flex; align-items: center; justify-content: center; background: rgba(58,58,64,0.45); border: 0.5px solid rgba(255,255,255,0.22)">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a>
    </div>
    <h1 style="margin: -6px 0 0; font-size: 30px; font-weight: 700">Gym gần nhà</h1>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <span style="font-size: 13px; color: #A1A1A8; padding-left: 16px">Bánh tạ có ở phòng này (chạm để bật / tắt)</span>
      <div style="display: flex; flex-wrap: wrap; gap: 8px">
        <sc-for list="{{ plates }}" as="p" hint-placeholder-count="7">
          <button onClick="{{ p.toggle }}" aria-pressed="{{ p.pressed }}" style="height: 40px; min-width: 58px; padding: 0 12px; border: 0; border-radius: 20px; background: {{ p.bg }}; color: {{ p.color }}; font: 600 15px ui-rounded, 'SF Pro Rounded', -apple-system, sans-serif">{{ p.label }}</button>
        </sc-for>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <span style="font-size: 13px; color: #A1A1A8; padding-left: 16px">Bước tạ thật của máy</span>
      <section style="background: #1C1C1E; border-radius: 26px; overflow: hidden">
        <sc-for list="{{ machines }}" as="m" hint-placeholder-count="3">
          <div style="display: flex; align-items: center; min-height: 48px; padding: 0 16px; border-top: {{ m.border }}"><span style="flex: 1; font-size: 17px">{{ m.name }}</span><span style="font-size: 15px; color: #A1A1A8">{{ m.step }}</span></div>
        </sc-for>
      </section>
    </div>

    <section style="background: #1C1C1E; border-radius: 26px; padding: 16px; display: flex; flex-direction: column; gap: 12px">
      <div style="display: flex; align-items: center; gap: 8px">
        <span style="flex: 1; display: flex; flex-direction: column"><span style="font-size: 17px; font-weight: 600">Máy tính bánh tạ</span><span style="font-size: 12px; color: #A1A1A8">Thanh đòn 20 kg</span></span>
        <button onClick="{{ tMinus }}" aria-label="Giảm 2,5 kg" style="width: 40px; height: 40px; border: 0; border-radius: 20px; background: #2C2C2E; color: #FFFFFF; font: 600 20px -apple-system, sans-serif">−</button>
        <span style="min-width: 80px; text-align: center; font: 700 22px ui-rounded, 'SF Pro Rounded', -apple-system, sans-serif">{{ target }}</span>
        <button onClick="{{ tPlus }}" aria-label="Tăng 2,5 kg" style="width: 40px; height: 40px; border: 0; border-radius: 20px; background: #2C2C2E; color: #FFFFFF; font: 600 20px -apple-system, sans-serif">+</button>
      </div>
      <div role="img" aria-label="{{ plateLabel }}" style="display: flex; align-items: center; justify-content: center; height: 96px">
        <span style="width: 18px; height: 14px; background: #8E8E93; border-radius: 3px"></span>
        <sc-for list="{{ load }}" as="l" hint-placeholder-count="3">
          <span style="width: 14px; height: {{ l.h }}px; margin-left: 3px; border-radius: 4px; background: {{ l.c }}"></span>
        </sc-for>
        <span style="width: 120px; height: 10px; background: #8E8E93; border-radius: 2px; margin-left: 3px"></span>
      </div>
      <span style="font-size: 15px; text-align: center">{{ perSide }}</span>
      <span style="font-size: 13px; text-align: center; color: {{ noteColor }}">{{ note }}</span>
    </section>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { owned: [true, true, false, true, true, true, true], target: 72.5 };
  }
  renderVals() {
    const s = this.state;
    const P = [25, 20, 15, 10, 5, 2.5, 1.25];
    const C = { 25: '#FF453A', 20: '#0A84FF', 15: '#FFD60A', 10: '#30D158', 5: '#F2F2F7', 2.5: '#FF9F0A', 1.25: '#A1A1A8' };
    const fmt = (n) => (Math.round(n * 100) / 100).toString().replace('.', ',');
    const plates = P.map((kg, i) => ({
      label: fmt(kg), pressed: s.owned[i] ? 'true' : 'false',
      bg: s.owned[i] ? '#4BE3A7' : '#1C1C1E', color: s.owned[i] ? '#00140C' : '#8E8E93',
      toggle: () => { const n = s.owned.slice(); n[i] = !n[i]; this.setState({ owned: n }); }
    }));
    let side = Math.max(0, (s.target - 20) / 2);
    const used = [];
    P.forEach((kg, i) => {
      if (!s.owned[i]) return;
      while (side >= kg - 1e-9) { used.push(kg); side -= kg; }
    });
    const exact = side < 1e-6;
    const real = s.target - side * 2;
    return {
      plates,
      machines: [['Kéo xô máy', 'bước 5 kg · 5–100 kg'], ['Đạp đùi máy', 'bước 10 kg · 20–250 kg'], ['Đẩy ngực máy', 'bước 4,5 kg · 9–90 kg']]
        .map(([name, step], i) => ({ name, step, border: i === 0 ? '0' : '0.5px solid #38383A' })),
      target: fmt(s.target) + ' kg',
      load: used.map((kg) => ({ h: 28 + kg * 2.4, c: C[kg] })),
      perSide: used.length ? 'Mỗi bên: ' + used.map(fmt).join(' + ') + ' kg' : 'Chỉ thanh đòn',
      note: exact ? 'Lắp được đúng mức tạ.' : 'Không đủ bánh để lắp đúng – gần nhất ' + fmt(real) + ' kg. App sẽ gợi ý mức này.',
      noteColor: exact ? '#8FE3C1' : '#FFC58A',
      plateLabel: 'Mỗi bên thanh đòn: ' + used.map(fmt).join(', ') + ' kg',
      tMinus: () => this.setState({ target: Math.max(20, s.target - 2.5) }),
      tPlus: () => this.setState({ target: s.target + 2.5 })
    };
  }
}
</script>
</body>
</html>
