<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>AuraFit – Story bữa ăn</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;background:#000}
a{color:#4BE3A7}a:hover{color:#7BF0C2}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #000000; color: #FFFFFF; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', 'Segoe UI', Roboto, sans-serif; box-sizing: border-box">
  <div role="img" aria-label="Ảnh bữa trưa của Minh" style="position: absolute; left: 8px; right: 8px; top: 8px; bottom: 110px; border-radius: 28px; background: #3B3324; display: flex; align-items: center; justify-content: center; color: #7C6B52">
    <svg width="44" height="44" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M9 4.5h6l1.6 2H20a1.5 1.5 0 0 1 1.5 1.5v10.5A1.5 1.5 0 0 1 20 20H4a1.5 1.5 0 0 1-1.5-1.5V8A1.5 1.5 0 0 1 4 6.5h3.4z"></path></svg>
  </div>

  <div style="position: absolute; left: 20px; right: 20px; top: 20px; display: flex; flex-direction: column; gap: 12px">
    <div style="display: flex; gap: 4px">
      <span style="flex: 1; height: 3px; border-radius: 2px; background: #FFFFFF"></span>
      <span style="flex: 1; height: 3px; border-radius: 2px; background: rgba(255,255,255,0.7)"></span>
      <span style="flex: 1; height: 3px; border-radius: 2px; background: rgba(255,255,255,0.3)"></span>
    </div>
    <div style="display: flex; align-items: center; gap: 10px">
      <span style="width: 36px; height: 36px; border-radius: 18px; background: #24413A; display: flex; align-items: center; justify-content: center; font-weight: 600">M</span>
      <span style="flex: 1; display: flex; flex-direction: column"><span style="font-size: 15px; font-weight: 600">Minh</span><span style="font-size: 13px; color: #EBEBF5">Bữa trưa · 12:40</span></span>
      <a href="Diary.dc.html" aria-label="Đóng" style="width: 44px; height: 44px; border-radius: 22px; color: #FFFFFF; display: flex; align-items: center; justify-content: center; background: rgba(40,40,46,0.5); border: 0.5px solid rgba(255,255,255,0.22)">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></a>
    </div>
  </div>

  <div style="position: absolute; left: 20px; right: 20px; bottom: 128px; padding: 12px 16px; border-radius: 20px; background: rgba(40,40,46,0.55); backdrop-filter: blur(20px) saturate(180%); -webkit-backdrop-filter: blur(20px) saturate(180%); border: 0.5px solid rgba(255,255,255,0.22); display: flex; flex-direction: column; gap: 2px">
    <span style="font-size: 17px; font-weight: 600">Cơm gạo lứt + ức gà áp chảo</span>
    <span style="font-size: 13px; color: #EBEBF5">520 kcal · Protein 42 g · ngày 92 điểm</span>
  </div>

  <div role="group" aria-label="Thả cảm xúc" style="position: absolute; left: 16px; right: 16px; bottom: 30px; display: flex; justify-content: space-between">
    <sc-for list="{{ reacts }}" as="r" hint-placeholder-count="5">
      <button onClick="{{ r.pick }}" aria-pressed="{{ r.pressed }}" aria-label="{{ r.label }}" style="width: 60px; height: 60px; border-radius: 30px; color: {{ r.color }}; display: flex; align-items: center; justify-content: center; background: {{ r.bg }}; border: 0.5px solid rgba(255,255,255,0.22)">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="{{ r.d }}"></path></svg></button>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { sel: 'fire' };
  }
  renderVals() {
    const R = [
      ['fire', 'Bốc lửa', 'M12 2.5c1.2 3.2 4.8 5.2 4.8 9.8a4.8 4.8 0 0 1-9.6 0c0-2.3 1.1-3.6 2.3-4.6.1 2.1 1.2 3.3 2.4 3.4-.2-3.3-1.1-5.6.1-8.6z'],
      ['heart', 'Thích', 'M12 21s-7.5-4.6-9.3-9.2C1.4 8.4 3.6 5 7 5c2 0 3.4 1.1 5 3 1.6-1.9 3-3 5-3 3.4 0 5.6 3.4 4.3 6.8C19.5 16.4 12 21 12 21z'],
      ['star', 'Xuất sắc', 'M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z'],
      ['bolt', 'Sung sức', 'M13 2.5L4.5 14h6.2l-1.2 7.5L18 10h-6.2z'],
      ['strong', 'Mạnh mẽ', 'M6 7h3v10H6zM15 7h3v10h-3zM2 9h3v6H2zM19 9h3v6h-3zM9 11h6v2H9z']
    ];
    const reacts = R.map(([k, label, d]) => {
      const on = this.state.sel === k;
      return {
        label, d, pressed: on ? 'true' : 'false',
        bg: on ? 'rgba(75,227,167,0.9)' : 'rgba(58,58,64,0.5)',
        color: on ? '#00140C' : '#FFFFFF',
        pick: () => this.setState({ sel: k })
      };
    });
    return { reacts };
  }
}
</script>
</body>
</html>
