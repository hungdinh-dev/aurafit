<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>AuraFit – Thêm món</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;background:#000}
a{color:#4BE3A7}a:hover{color:#7BF0C2}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #000000; color: #FFFFFF; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', 'Segoe UI', Roboto, sans-serif; box-sizing: border-box">
  <div style="position: absolute; left: 0; right: 0; top: 10px; bottom: 0; background: #1C1C1E; border-radius: 38px 38px 0 0; padding: 8px 16px 0; display: flex; flex-direction: column; gap: 16px; box-sizing: border-box">
    <span aria-hidden="true" style="align-self: center; width: 36px; height: 5px; border-radius: 3px; background: #48484A"></span>

    <header style="display: flex; align-items: center; gap: 8px">
      <a href="Main.dc.html" aria-label="Đóng" style="width: 44px; height: 44px; border-radius: 22px; background: #2C2C2E; color: #EBEBF5; display: flex; align-items: center; justify-content: center">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></a>
      <h1 style="margin: 0; flex: 1; text-align: center; font-size: 17px; font-weight: 600">Thêm món</h1>
      <span style="width: 44px"></span>
    </header>

    <div role="group" aria-label="Bữa" style="display: flex; padding: 2px; border-radius: 10px; background: rgba(118,118,128,0.24)">
      <sc-for list="{{ slots }}" as="s" hint-placeholder-count="4">
        <button onClick="{{ s.pick }}" aria-pressed="{{ s.pressed }}" style="flex: 1; height: 32px; border: 0; border-radius: 8px; background: {{ s.bg }}; color: #FFFFFF; font: {{ s.weight }} 13px -apple-system, 'Segoe UI', sans-serif; box-shadow: {{ s.shadow }}">{{ s.label }}</button>
      </sc-for>
    </div>

    <div style="display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 10px; border-radius: 12px; background: rgba(118,118,128,0.24); color: #A1A1A8">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"></circle><path d="M20 20l-4.2-4.2"></path></svg>
      <label for="q" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Tìm món</label>
      <input id="q" placeholder="Tìm món của bạn" style="flex: 1; border: 0; background: none; color: #FFFFFF; font: 400 17px -apple-system, 'Segoe UI', sans-serif; outline: none">
    </div>

    <section style="background: #2C2C2E; border-radius: 22px; overflow: hidden">
      <div style="display: flex; align-items: center; gap: 12px; min-height: 64px; padding: 0 8px 0 16px">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="#4BE3A7" aria-hidden="true"><path d="M13 2.5L4.5 14h6.2l-1.2 7.5L18 10h-6.2z"></path></svg>
        <div style="flex: 1; display: flex; flex-direction: column; gap: 2px">
          <span style="font-size: 15px; font-weight: 600; color: #4BE3A7">Ăn gì bây giờ?</span>
          <span style="font-size: 15px">Ức gà áp chảo + ½ bát cơm</span>
          <span style="font-size: 13px; color: #A1A1A8">430 kcal · 52 g protein</span>
        </div>
        <button aria-label="Thêm ức gà áp chảo và cơm" style="width: 44px; height: 44px; border: 0; border-radius: 22px; background: none; color: #4BE3A7; display: flex; align-items: center; justify-content: center">
          <svg width="26" height="26" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10" fill="#4BE3A7"></circle><path d="M12 7.5v9M7.5 12h9" stroke="#00140C" stroke-width="2.2" stroke-linecap="round"></path></svg></button>
      </div>
      <div style="display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 0 8px 0 0; margin-left: 48px; border-top: 0.5px solid #48484A">
        <span style="flex: 1; display: flex; align-items: center; gap: 12px; margin-left: -32px">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#A1A1A8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"></path><path d="M3 3v5h5"></path></svg>
          <span style="font-size: 15px">Như bữa tối hôm qua <span style="color: #A1A1A8">· 620 kcal</span></span></span>
        <button aria-label="Thêm như bữa tối hôm qua" style="width: 44px; height: 44px; border: 0; border-radius: 22px; background: none; display: flex; align-items: center; justify-content: center">
          <svg width="26" height="26" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10" fill="#3A3A3C"></circle><path d="M12 7.5v9M7.5 12h9" stroke="#4BE3A7" stroke-width="2.2" stroke-linecap="round"></path></svg></button>
      </div>
    </section>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <span style="font-size: 13px; color: #A1A1A8; padding-left: 16px">Món của tôi</span>
      <section style="background: #2C2C2E; border-radius: 22px; overflow: hidden">
        <sc-for list="{{ library }}" as="f" hint-placeholder-count="4">
          <div style="display: flex; align-items: center; gap: 12px; min-height: 60px; padding: 0 8px 0 16px; border-top: {{ f.border }}">
            <div style="flex: 1; display: flex; flex-direction: column; gap: 2px; min-width: 0">
              <span style="font-size: 17px">{{ f.name }}</span>
              <span style="font-size: 13px; color: #A1A1A8">{{ f.meta }}</span>
            </div>
            <button aria-label="Thêm {{ f.name }}" style="width: 44px; height: 44px; border: 0; border-radius: 22px; background: none; display: flex; align-items: center; justify-content: center">
              <svg width="26" height="26" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10" fill="#3A3A3C"></circle><path d="M12 7.5v9M7.5 12h9" stroke="#4BE3A7" stroke-width="2.2" stroke-linecap="round"></path></svg></button>
          </div>
        </sc-for>
      </section>
    </div>
  </div>

  <div style="position: absolute; left: 16px; right: 16px; bottom: 26px; display: flex; gap: 10px; align-items: center">
    <div style="display: flex; height: 62px; border-radius: 31px; padding: 0 6px; align-items: center; background: rgba(72,72,78,0.5); backdrop-filter: blur(28px) saturate(180%); -webkit-backdrop-filter: blur(28px) saturate(180%); border: 0.5px solid rgba(255,255,255,0.22); box-shadow: inset 0 1px 0 rgba(255,255,255,0.16), 0 10px 30px rgba(0,0,0,0.5)">
      <a href="TextLog.dc.html" aria-label="Mô tả bằng chữ hoặc giọng nói" style="width: 50px; height: 50px; border-radius: 25px; color: #FFFFFF; display: flex; align-items: center; justify-content: center">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"></rect><path d="M5 11a7 7 0 0 0 14 0M12 18v3"></path></svg></a>
      <a href="Barcode.dc.html" aria-label="Quét mã vạch" style="width: 50px; height: 50px; border-radius: 25px; color: #FFFFFF; display: flex; align-items: center; justify-content: center">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 8V5h3M17 5h3v3M20 16v3h-3M7 19H4v-3M8 9v6M11 9v6M14 9v6M16.5 9v6"></path></svg></a>
    </div>
    <a href="ConfirmMeal.dc.html" style="flex: 1; height: 62px; border-radius: 31px; display: flex; align-items: center; justify-content: center; gap: 8px; color: #00140C; font-size: 17px; font-weight: 600; text-decoration: none; background: rgba(75,227,167,0.9); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 0.5px solid rgba(255,255,255,0.45); box-shadow: inset 0 1px 0 rgba(255,255,255,0.5), 0 10px 26px rgba(75,227,167,0.25)">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M9 4.5h6l1.6 2H20a1.5 1.5 0 0 1 1.5 1.5v10.5A1.5 1.5 0 0 1 20 20H4a1.5 1.5 0 0 1-1.5-1.5V8A1.5 1.5 0 0 1 4 6.5h3.4z"></path><circle cx="12" cy="13" r="3.6" fill="#4BE3A7"></circle></svg>Chụp ảnh</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { slot: 'Tối' };
  }
  renderVals() {
    const slots = ['Sáng', 'Trưa', 'Tối', 'Phụ'].map((label) => {
      const on = this.state.slot === label;
      return {
        label,
        pressed: on ? 'true' : 'false',
        bg: on ? '#636366' : 'transparent',
        weight: on ? '600' : '500',
        shadow: on ? '0 3px 8px rgba(0,0,0,0.25)' : 'none',
        pick: () => this.setState({ slot: label })
      };
    });
    const library = [
      { name: 'Ức gà áp chảo 150 g', meta: '250 kcal · 46 g protein' },
      { name: 'Cơm + cá kho + rau', meta: '610 kcal · combo 3 món' },
      { name: 'Whey 1 muỗng', meta: '120 kcal · 24 g protein' },
      { name: 'Cà phê sữa đá', meta: '130 kcal · thường buổi sáng' }
    ].map((f, i) => Object.assign(f, { border: i === 0 ? '0' : '0.5px solid #48484A' }));
    return { slots, library };
  }
}
</script>
</body>
</html>
