<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>AuraFit – Onboarding: về bạn</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;background:#000}
a{color:#4BE3A7}a:hover{color:#7BF0C2}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #000000; color: #FFFFFF; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', 'Segoe UI', Roboto, sans-serif; box-sizing: border-box">
  <div style="padding: 12px 16px 0; display: flex; flex-direction: column; gap: 16px">
    <div style="display: flex; align-items: center; gap: 14px">
      <a href="Welcome.dc.html" aria-label="Quay lại" style="width: 44px; height: 44px; border-radius: 22px; color: #FFFFFF; display: flex; align-items: center; justify-content: center; background: rgba(58,58,64,0.45); border: 0.5px solid rgba(255,255,255,0.22)">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a>
      <div role="progressbar" aria-label="Bước 2 trên 5" aria-valuenow="2" aria-valuemin="0" aria-valuemax="5" style="flex: 1; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 4px">
        <span style="height: 4px; border-radius: 2px; background: #4BE3A7"></span><span style="height: 4px; border-radius: 2px; background: #4BE3A7"></span><span style="height: 4px; border-radius: 2px; background: #3A3A3C"></span><span style="height: 4px; border-radius: 2px; background: #3A3A3C"></span><span style="height: 4px; border-radius: 2px; background: #3A3A3C"></span>
      </div>
    </div>
    <h1 style="margin: 0; font-size: 30px; font-weight: 700">Về bạn</h1>

    <section style="background: #1C1C1E; border-radius: 26px; overflow: hidden">
      <div style="display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 0 12px 0 16px">
        <span style="flex: 1; font-size: 17px">Giới tính</span>
        <div role="group" aria-label="Giới tính" style="display: flex; padding: 2px; border-radius: 9px; background: rgba(118,118,128,0.24)">
          <button onClick="{{ male }}" aria-pressed="{{ mPressed }}" style="width: 56px; height: 30px; border: 0; border-radius: 7px; background: {{ mBg }}; color: #FFFFFF; font: 600 13px -apple-system, 'Segoe UI', sans-serif">Nam</button>
          <button onClick="{{ female }}" aria-pressed="{{ fPressed }}" style="width: 56px; height: 30px; border: 0; border-radius: 7px; background: {{ fBg }}; color: #FFFFFF; font: 600 13px -apple-system, 'Segoe UI', sans-serif">Nữ</button>
        </div>
      </div>
      <sc-for list="{{ rows }}" as="r" hint-placeholder-count="3">
        <button style="width: 100%; display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 0 16px; border: 0; border-top: 0.5px solid #38383A; background: none; color: #FFFFFF; font: 400 17px -apple-system, 'Segoe UI', sans-serif; text-align: left">
          <span style="flex: 1">{{ r.label }}</span><span style="color: #A1A1A8">{{ r.value }}</span>
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#5A5A60" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg>
        </button>
      </sc-for>
    </section>

    <fieldset style="margin: 0; border: 0; padding: 0; display: flex; flex-direction: column; gap: 8px">
      <legend style="font-size: 13px; color: #A1A1A8; padding: 0 0 8px 16px">Mức vận động hằng ngày</legend>
      <div style="display: flex; padding: 2px; border-radius: 10px; background: rgba(118,118,128,0.24)">
        <sc-for list="{{ acts }}" as="a" hint-placeholder-count="4">
          <button onClick="{{ a.pick }}" aria-pressed="{{ a.pressed }}" style="flex: 1; height: 32px; border: 0; border-radius: 8px; background: {{ a.bg }}; color: #FFFFFF; font: 600 13px -apple-system, 'Segoe UI', sans-serif">{{ a.label }}</button>
        </sc-for>
      </div>
      <span style="font-size: 13px; color: #A1A1A8; padding-left: 16px">{{ actDesc }}</span>
    </fieldset>

    <fieldset style="margin: 0; border: 0; padding: 0; display: flex; flex-direction: column; gap: 8px">
      <legend style="font-size: 13px; color: #A1A1A8; padding: 0 0 8px 16px">Mục tiêu</legend>
      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
        <sc-for list="{{ goals }}" as="g" hint-placeholder-count="3">
          <button onClick="{{ g.pick }}" aria-pressed="{{ g.pressed }}" style="height: 72px; border: 0; border-radius: 18px; background: #1C1C1E; box-shadow: {{ g.ring }}; color: #FFFFFF; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font: 600 15px -apple-system, 'Segoe UI', sans-serif">{{ g.label }}<span style="font-size: 12px; font-weight: 400; color: #A1A1A8">{{ g.sub }}</span></button>
        </sc-for>
      </div>
    </fieldset>

    <fieldset style="margin: 0; border: 0; padding: 0; display: flex; flex-direction: column; gap: 8px">
      <legend style="font-size: 13px; color: #A1A1A8; padding: 0 0 8px 16px">Tốc độ</legend>
      <div style="display: flex; padding: 2px; border-radius: 10px; background: rgba(118,118,128,0.24)">
        <sc-for list="{{ paces }}" as="p" hint-placeholder-count="4">
          <button onClick="{{ p.pick }}" aria-pressed="{{ p.pressed }}" style="flex: 1; height: 32px; border: 0; border-radius: 8px; background: {{ p.bg }}; color: #FFFFFF; font: 600 12px -apple-system, 'Segoe UI', sans-serif">{{ p.label }}</button>
        </sc-for>
      </div>
      <span style="font-size: 13px; color: #A1A1A8; padding-left: 16px">{{ paceDesc }}</span>
    </fieldset>
  </div>

  <div style="position: absolute; left: 16px; right: 16px; bottom: 26px">
    <a href="OnbResult.dc.html" style="height: 56px; border-radius: 28px; display: flex; align-items: center; justify-content: center; color: #00140C; font-size: 17px; font-weight: 600; text-decoration: none; background: rgba(75,227,167,0.9); border: 0.5px solid rgba(255,255,255,0.45)">Xem mục tiêu của tôi</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { sex: 'm', act: 'Vừa', goal: 'Giảm mỡ', pace: 'Vừa' };
  }
  renderVals() {
    const seg = (on) => (on ? '#636366' : 'transparent');
    const acts = ['Ít', 'Nhẹ', 'Vừa', 'Nhiều'].map((label) => ({
      label, pressed: this.state.act === label ? 'true' : 'false', bg: seg(this.state.act === label),
      pick: () => this.setState({ act: label })
    }));
    const actD = { 'Ít': 'Ngồi nhiều, gần như không tập', 'Nhẹ': 'Tập 1–2 buổi/tuần', 'Vừa': 'Tập 3–5 buổi/tuần', 'Nhiều': 'Tập 6–7 buổi/tuần hoặc việc nặng' };
    const goals = [['Giảm mỡ', 'thâm hụt kcal'], ['Giữ cân', 'cân bằng'], ['Tăng cơ', 'dư kcal nhẹ']].map(([label, sub]) => ({
      label, sub, pressed: this.state.goal === label ? 'true' : 'false',
      ring: this.state.goal === label ? 'inset 0 0 0 2px #4BE3A7' : 'none',
      pick: () => this.setState({ goal: label })
    }));
    const paces = ['Nhẹ', 'Vừa', 'Nhanh', 'App quyết'].map((label) => ({
      label, pressed: this.state.pace === label ? 'true' : 'false', bg: seg(this.state.pace === label),
      pick: () => this.setState({ pace: label })
    }));
    const kg = { 'Nhẹ': '0,25', 'Vừa': '0,5', 'Nhanh': '0,75' };
    const goal = this.state.goal;
    const paceDesc = goal === 'Giữ cân'
      ? 'Giữ cân không cần chọn tốc độ.'
      : this.state.pace === 'App quyết'
        ? 'App chọn theo % mỡ, trình độ và mức tuân thủ của bạn.'
        : (goal === 'Giảm mỡ' ? '−' : '+') + kg[this.state.pace] + ' kg/tuần';
    const m = this.state.sex === 'm';
    return {
      rows: [{ label: 'Năm sinh', value: '1999' }, { label: 'Chiều cao', value: '172 cm' }, { label: 'Cân nặng', value: '71,4 kg' }],
      acts, actDesc: actD[this.state.act], goals, paces, paceDesc,
      mBg: seg(m), fBg: seg(!m), mPressed: m ? 'true' : 'false', fPressed: m ? 'false' : 'true',
      male: () => this.setState({ sex: 'm' }), female: () => this.setState({ sex: 'f' })
    };
  }
}
</script>
</body>
</html>
