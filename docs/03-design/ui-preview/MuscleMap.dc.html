<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { mode: 'volume', sel: 'chest_upper' };
  }
  renderVals() {
    const P = {
      traps_front: ['Cơ thang', 9, 84], traps_upper: ['Thang trên', 13, 84], traps_mid: ['Thang giữa', 14, 80], traps_low: ['Thang dưới', 12, 88],
      front_delts: ['Vai trước', 10, 55], rear_delts: ['Vai sau', 10, 82],
      chest_upper: ['Ngực trên', 22, 35], chest_middle: ['Ngực giữa', 20, 52], chest_lower: ['Ngực dưới', 18, 90],
      biceps_long: ['Tay trước – đầu dài', 8, 86], biceps_short: ['Tay trước – đầu ngắn', 8, 86],
      triceps_long: ['Tay sau – đầu dài', 9, 48], triceps_lat: ['Tay sau – đầu ngoài', 10, 45],
      forearm_flex: ['Cẳng tay – nhóm gập', 4, 94], forearm_ext: ['Cẳng tay – nhóm duỗi', 4, 94],
      serratus: ['Cơ răng cưa', 8, 92], obliques: ['Bụng chéo', 8, 92], abs_upper: ['Bụng trên', 10, 76], abs_lower: ['Bụng dưới', 9, 80],
      rectus: ['Cơ thẳng đùi', 14, 100], vastus_lat: ['Đùi trước – rộng ngoài', 14, 100], vastus_med: ['Đùi trước – rộng trong', 13, 100],
      adductors: ['Nhóm khép đùi', 4, 100], gastro_med: ['Bắp chân trong', 9, 100], gastro_lat: ['Bắp chân ngoài', 9, 100], soleus: ['Cơ dép', 7, 100],
      infraspinatus: ['Cơ dưới gai', 14, 64], teres: ['Cơ tròn lớn', 12, 70], lats: ['Xô', 14, 62], erector: ['Cơ dựng sống', 12, 91],
      glute_med: ['Mông nhỡ', 12, 100], glute_max: ['Mông lớn', 13, 100], ham_bf: ['Đùi sau – nhị đầu', 5, 96], ham_st: ['Đùi sau – bán gân', 5, 96]
    };
    const vol = (s) => s >= 18 ? ['#FF6A1A', 'Khối lượng cao'] : s >= 12 ? ['#E3E04A', 'Khá cao'] : s >= 6 ? ['#2ECC52', 'Vừa'] : ['#2F6BFF', 'Thấp'];
    const rec = (r) => r >= 80 ? ['#48484A', 'Sẵn sàng'] : r >= 65 ? ['#8E4B48', 'Hơi mỏi'] : r >= 40 ? ['#C9504A', 'Mỏi vừa'] : ['#FF453A', 'Mỏi nặng'];
    const isVol = this.state.mode === 'volume';
    const f = {}, p = {};
    Object.keys(P).forEach((k) => {
      f[k] = (isVol ? vol(P[k][1]) : rec(P[k][2]))[0];
      p[k] = () => this.setState({ sel: k });
    });
    const s = P[this.state.sel];
    const lv = isVol ? vol(s[1]) : rec(s[2]);
    return {
      f, p,
      chipName: s[0],
      chipLevel: isVol ? lv[1] + ' · ' + s[1] + ' set' : lv[1] + ' · ' + s[2] + '%',
      chipColor: lv[0],
      legend: isVol
        ? [{ color: '#2F6BFF', label: 'Thấp < 6' }, { color: '#2ECC52', label: 'Vừa 6–11' }, { color: '#E3E04A', label: 'Khá cao 12–17' }, { color: '#FF6A1A', label: 'Cao ≥ 18 set' }]
        : [{ color: '#FF453A', label: 'Mỏi nặng' }, { color: '#C9504A', label: 'Mỏi vừa' }, { color: '#8E4B48', label: 'Hơi mỏi' }, { color: '#48484A', label: 'Sẵn sàng' }],
      summary: isVol
        ? 'Tuần này 186 set · cao nhất Ngực (22) · thấp nhất Cẳng tay, Đùi sau'
        : 'Mỏi nhất: Ngực trên 35 % · Tay sau 45–48 %',
      volBg: isVol ? '#636366' : 'transparent',
      recBg: isVol ? 'transparent' : '#636366',
      volPressed: isVol ? 'true' : 'false',
      recPressed: isVol ? 'false' : 'true',
      toVolume: () => this.setState({ mode: 'volume' }),
      toRecovery: () => this.setState({ mode: 'recovery' })
    };
  }
}
</script>
</body>
</html>
