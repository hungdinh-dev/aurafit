<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>AuraFit – Xác nhận món</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;background:#000}
a{color:#4BE3A7}a:hover{color:#7BF0C2}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #000000; color: #FFFFFF; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', 'Segoe UI', Roboto, sans-serif; box-sizing: border-box">
  <div style="position: absolute; left: 0; right: 0; top: 10px; bottom: 0; background: #1C1C1E; border-radius: 38px 38px 0 0; padding: 8px 16px 0; display: flex; flex-direction: column; gap: 14px; box-sizing: border-box">
    <span aria-hidden="true" style="align-self: center; width: 36px; height: 5px; border-radius: 3px; background: #48484A"></span>

    <header style="display: flex; align-items: center; gap: 8px">
      <a href="AddFood.dc.html" aria-label="Quay lại" style="width: 44px; height: 44px; border-radius: 22px; background: #2C2C2E; color: #EBEBF5; display: flex; align-items: center; justify-content: center">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a>
      <h1 style="margin: 0; flex: 1; text-align: center; font-size: 17px; font-weight: 600">Bữa tối</h1>
      <span style="width: 44px; text-align: right; font-size: 15px; color: #A1A1A8">19:12</span>
    </header>

    <div role="img" aria-label="Ảnh bữa tối vừa chụp" style="position: relative; height: 168px; border-radius: 22px; background: #3B2F22; display: flex; align-items: center; justify-content: center; color: #8C7A62">
      <svg width="34" height="34" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M9 4.5h6l1.6 2H20a1.5 1.5 0 0 1 1.5 1.5v10.5A1.5 1.5 0 0 1 20 20H4a1.5 1.5 0 0 1-1.5-1.5V8A1.5 1.5 0 0 1 4 6.5h3.4z"></path></svg>
      <span style="position: absolute; left: 10px; top: 10px; height: 30px; padding: 0 12px; border-radius: 15px; display: flex; align-items: center; font-size: 13px; font-weight: 600; color: #FFFFFF; background: rgba(40,40,46,0.5); backdrop-filter: blur(20px) saturate(180%); -webkit-backdrop-filter: blur(20px) saturate(180%); border: 0.5px solid rgba(255,255,255,0.25)">AI khá chắc · 78%</span>
    </div>

    <div style="display: flex; justify-content: space-between; align-items: flex-end">
      <div style="display: flex; flex-direction: column; gap: 2px">
        <span style="font-size: 22px; font-weight: 700">Phở bò tái</span>
        <span style="font-size: 13px; color: #A1A1A8">Bánh phở · bò tái · nước dùng · rau thơm</span>
      </div>
      <span style="font: 700 34px/1 ui-rounded, 'SF Pro Rounded', -apple-system, sans-serif">{{ kcal }}<span style="font-size: 15px; font-weight: 500; color: #A1A1A8"> kcal</span></span>
    </div>

    <div style="display: flex; gap: 14px; font-size: 13px; color: #A1A1A8">
      <span style="display: flex; align-items: center; gap: 5px"><span style="width: 8px; height: 8px; border-radius: 4px; background: #8F84FF"></span>P <strong style="color: #FFFFFF">{{ p }}g</strong></span>
      <span style="display: flex; align-items: center; gap: 5px"><span style="width: 8px; height: 8px; border-radius: 4px; background: #5AB0FF"></span>C <strong style="color: #FFFFFF">{{ c }}g</strong></span>
      <span style="display: flex; align-items: center; gap: 5px"><span style="width: 8px; height: 8px; border-radius: 4px; background: #FFB36B"></span>F <strong style="color: #FFFFFF">{{ f }}g</strong></span>
      <span style="display: flex; align-items: center; gap: 5px"><span style="width: 8px; height: 8px; border-radius: 4px; background: #F58FB4"></span>Đường <strong style="color: #FFFFFF">{{ s }}g</strong></span>
    </div>

    <sc-for list="{{ questions }}" as="q" hint-placeholder-count="3">
      <fieldset style="margin: 0; border: 0; padding: 0">
        <legend style="font-size: 13px; color: #A1A1A8; padding: 0 0 6px 4px">{{ q.title }}</legend>
        <div style="display: flex; padding: 2px; border-radius: 12px; background: rgba(118,118,128,0.24)">
          <sc-for list="{{ q.options }}" as="o" hint-placeholder-count="3">
            <button onClick="{{ o.pick }}" aria-pressed="{{ o.pressed }}" style="flex: 1; height: 44px; border: 0; border-radius: 10px; background: {{ o.bg }}; color: #FFFFFF; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; font: {{ o.weight }} 14px -apple-system, 'Segoe UI', sans-serif; box-shadow: {{ o.shadow }}">{{ o.label }}<span style="font-size: 11px; font-weight: 500; color: #C7C7CC">{{ o.delta }}</span></button>
          </sc-for>
        </div>
      </fieldset>
    </sc-for>

    <div style="display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 0 16px; border-radius: 22px; background: #2C2C2E">
      <span style="flex: 1; font-size: 17px">Lưu vào Món của tôi</span>
      <button role="switch" aria-checked="{{ saveChecked }}" aria-label="Lưu vào Món của tôi" onClick="{{ toggleSave }}" style="width: 51px; height: 31px; border: 0; border-radius: 16px; padding: 2px; background: {{ switchBg }}; display: flex; justify-content: {{ switchAlign }}">
        <span style="width: 27px; height: 27px; border-radius: 14px; background: #FFFFFF; box-shadow: 0 2px 6px rgba(0,0,0,0.3)"></span></button>
    </div>
  </div>

  <div style="position: absolute; left: 16px; right: 16px; bottom: 26px; display: flex; gap: 10px; align-items: center">
    <button style="height: 56px; padding: 0 20px; border-radius: 28px; color: #FFFFFF; font: 600 17px -apple-system, 'Segoe UI', sans-serif; background: rgba(72,72,78,0.5); backdrop-filter: blur(28px) saturate(180%); -webkit-backdrop-filter: blur(28px) saturate(180%); border: 0.5px solid rgba(255,255,255,0.22); box-shadow: inset 0 1px 0 rgba(255,255,255,0.16)">Phân tích lại</button>
    <a href="Diary.dc.html" style="flex: 1; height: 56px; border-radius: 28px; display: flex; align-items: center; justify-content: center; color: #00140C; font-size: 17px; font-weight: 600; text-decoration: none; background: rgba(75,227,167,0.9); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 0.5px solid rgba(255,255,255,0.45); box-shadow: inset 0 1px 0 rgba(255,255,255,0.5), 0 10px 26px rgba(75,227,167,0.25)">Lưu bữa tối</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { size: 'Vừa', quay: 'Không', broth: 'Một nửa', save: true };
  }
  renderVals() {
    const base = { kcal: 480, p: 28, c: 62, f: 12, s: 4 };
    const defs = [
      { key: 'size', title: 'Cỡ bát', options: [
        { label: 'Nhỏ', d: { kcal: -120, p: -6, c: -16, f: -3, s: 0 } },
        { label: 'Vừa', d: { kcal: 0, p: 0, c: 0, f: 0, s: 0 } },
        { label: 'Lớn', d: { kcal: 150, p: 8, c: 20, f: 4, s: 1 } }
      ] },
      { key: 'quay', title: 'Ăn kèm quẩy', options: [
        { label: 'Không', d: { kcal: 0, p: 0, c: 0, f: 0, s: 0 } },
        { label: 'Có', d: { kcal: 230, p: 4, c: 25, f: 12, s: 1 } }
      ] },
      { key: 'broth', title: 'Nước dùng', options: [
        { label: 'Một nửa', d: { kcal: 0, p: 0, c: 0, f: 0, s: 0 } },
        { label: 'Húp hết', d: { kcal: 40, p: 1, c: 2, f: 3, s: 1 } }
      ] }
    ];
    const t = Object.assign({}, base);
    const questions = defs.map((q) => ({
      title: q.title,
      options: q.options.map((o) => {
        const on = this.state[q.key] === o.label;
        if (on) { Object.keys(t).forEach((k) => { t[k] += o.d[k]; }); }
        return {
          label: o.label,
          delta: o.d.kcal === 0 ? '±0' : (o.d.kcal > 0 ? '+' : '−') + Math.abs(o.d.kcal),
          pressed: on ? 'true' : 'false',
          bg: on ? '#636366' : 'transparent',
          weight: on ? '600' : '500',
          shadow: on ? '0 3px 8px rgba(0,0,0,0.25)' : 'none',
          pick: () => this.setState({ [q.key]: o.label })
        };
      })
    }));
    const save = this.state.save;
    return {
      questions,
      kcal: t.kcal.toLocaleString('vi-VN'), p: t.p, c: t.c, f: t.f, s: t.s,
      saveChecked: save ? 'true' : 'false',
      switchBg: save ? '#30D158' : 'rgba(120,120,128,0.32)',
      switchAlign: save ? 'flex-end' : 'flex-start',
      toggleSave: () => this.setState({ save: !save })
    };
  }
}
</script>
</body>
</html>
