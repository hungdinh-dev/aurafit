# Supabase CLI configuration for AuraFit (local dev + deploy settings).
# Docs: https://supabase.com/docs/guides/local-development/cli/config
# No secrets in this file: function secrets are set with `supabase secrets set` (see README.md).

project_id = "aurafit"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.seed]
enabled = true
# Generated by supabase/seed/build-seed.mjs; applied in file-name order.
sql_paths = ["./seed/*.sql"]

[realtime]
enabled = false

[studio]
enabled = true
port = 54323

[storage]
enabled = true
file_size_limit = "20MiB"

[auth]
enabled = true
site_url = "aurafit://"
additional_redirect_urls = ["aurafit://auth-callback", "exp://127.0.0.1:8081"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = true
otp_length = 6
otp_expiry = 600

# Google sign-in (implementation-plan.md M0). Client id/secret come from env, never from git:
#   SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID / SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET
[auth.external.google]
enabled = false
client_id = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET)"
skip_nonce_check = true

[edge_runtime]
enabled = true
policy = "per_worker"
deno_version = 2

# User-facing functions: the gateway verifies the JWT and the function calls auth.getUser().
[functions.analyze-meal]
verify_jwt = true

[functions.analyze-text]
verify_jwt = true

# Called by pg_cron with CRON_SECRET (not a JWT) – the function checks the secret itself.
[functions.close-day]
verify_jwt = false

# Cron (CRON_SECRET) or user JWT – verified inside the function.
[functions.weekly-review]
verify_jwt = false
